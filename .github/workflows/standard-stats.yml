name: Update Standard stats

# Every 3 hours, read the review count and host score from the public
# Standard page and update stats.json, which the site shows.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the numbers from Standard
        run: python3 .github/scripts/standard_stats.py

      - name: Save and republish if they changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- stats.json; then
            echo "Numbers unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git commit -m "Update Standard stats"
          git push
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
